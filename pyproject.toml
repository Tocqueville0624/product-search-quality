[project]
name = "product-search-quality"
version = "0.1.0"
description = "Independent ESCI relevance and review-prioritization study with PySpark"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyspark==3.5.7",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==12.0.1",
  "matplotlib>=3.10,<3.11",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]
docs = ["reportlab>=4.4,<5", "pypdf>=6,<7", "pymupdf>=1.26,<1.27", "markdown-it-py>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
